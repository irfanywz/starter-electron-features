appId: com.example.starterminimal
productName: Starter Minimal
# Metadata exe (Properties > Details di Windows)
# ProductName = productName, FileDescription = description (package.json),
# CompanyName = author.name (package.json), LegalCopyright = copyright di bawah
copyright: "Copyright © 2026 Nama Perusahaan"
directories:
  buildResources: build
  output: release

# Cache download Electron/tool builder ditaruh di folder project (di-gitignore)
electronDownload:
  cache: .electron-cache

files:
  - out/**
  - package.json
asar: true

# Icon (window + tray) disalin apa adanya ke <folder app>/resources/resources, di luar app.asar
extraResources:
  - from: resources
    to: resources

# Portable = folder unpacked (bukan single exe yang extract ke temp tiap dibuka).
# Hasil: release/win-unpacked/, lalu `scripts/zip.mjs` ngebungkusnya jadi
# release/<productName> <version>.zip  (lihat script dist:win di package.json)
win:
  icon: build/icon.ico
  target:
    - target: dir
      arch: x64

linux:
  icon: build/icon.png
  target: dir
  category: Utility
